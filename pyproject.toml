[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendscout"
version = "0.1.0"
description = "Traceable content research and short-form ideation"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3", "pydantic>=2.8,<3", "typer>=0.12,<1", "rich>=13,<15", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
dashboard = ["streamlit>=1.40,<2"]

[project.scripts]
trendscout = "trendscout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trendscout = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
